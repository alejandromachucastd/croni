<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croni · Panel de usuarios</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1c1e22">
<style>
  :root{
    --bg:#ffffff; --panel:#f4f5f7; --panel-2:#eceef1;
    --text:#1c1e22; --muted:#6b7280; --border:#d8dbe0; --accent:#E09600;
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --panel:#1c1f24; --panel-2:#262a31;
    --text:#e7e9ec; --muted:#9aa0ab; --border:#33373f; --accent:#E09600;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:24px 18px 40px}
  .wrap{max-width:900px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:1.2rem;margin:0}
  header p{margin:0;color:var(--muted);font-size:.78rem}
  a.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:.8rem;border:1px solid var(--border);
    padding:6px 12px;border-radius:999px;transition:border-color .12s,color .12s,transform .1s}
  a.back:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .table-wrap{overflow-x:auto;border-radius:10px}
  table{width:100%;min-width:520px;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:.82rem}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
  th{background:var(--panel-2);color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:600;background:#e6f0ff;color:#1a56c4}
  :root[data-theme="dark"] .badge{background:#1c3a5e;color:#9cc2f2}
  .badge.admin{background:var(--accent);color:#1a1a1a;margin-left:6px}
  #msg{color:var(--muted);font-size:.85rem}
  #err{color:#e05a5a;font-size:.85rem}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .row-actions button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:999px;padding:5px 12px;font-size:.7rem;cursor:pointer;font-weight:600;
    transition:border-color .12s,color .12s,background .12s,transform .1s}
  .row-actions button:hover{border-color:#e05a5a;color:#e05a5a;background:rgba(224,90,90,.08);transform:translateY(-1px)}
  .row-actions button:active{transform:translateY(0)}
  .row-actions button:disabled{opacity:.4;cursor:default;transform:none}
  .row-actions button:disabled:hover{border-color:var(--border);color:var(--text);background:var(--panel-2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Usuarios registrados</h1>
    <p>Solo visible para administradores</p>
    <a class="back" href="/">← Volver al horario</a>
  </header>
  <p id="msg">Cargando…</p>
  <p id="err"></p>
  <div class="table-wrap">
    <table id="tbl" hidden>
      <thead><tr><th>Nombre</th><th>Correo</th><th>Registrado</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
(function(){ try{ document.documentElement.dataset.theme = localStorage.getItem('croni-theme') || 'light'; }catch(e){} })();

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadUsers(){
  const sRes = await fetch('/api/session'); const s = await sRes.json();
  if(!s.loggedIn){ location.href='/'; return; }
  if(!s.isAdmin){ document.getElementById('msg').hidden=true; document.getElementById('err').textContent='Tu cuenta no tiene permisos de administrador.'; return; }

  const res = await fetch('/api/admin/users');
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error||'Error'); }
  const { users } = await res.json();
  document.getElementById('msg').hidden = true;
  document.getElementById('tbl').hidden = false;
  document.getElementById('tbody').innerHTML = users.map(u => `
    <tr data-key="${esc(u.key)}">
      <td>${esc(u.nombre)}${u.isAdmin?'<span class="badge admin">admin</span>':''}</td>
      <td><span class="badge">${esc(u.email || u.username)}</span></td>
      <td>${new Date(u.createdAt).toLocaleString('es-MX')}</td>
      <td>
        <div class="row-actions">
          <button class="btn-delete" ${u.isAdmin && users.filter(x=>x.isAdmin).length<=1 ? 'disabled title="Es el único administrador"':''}>Eliminar</button>
        </div>
      </td>
    </tr>`).join('');
}

document.getElementById('tbody').addEventListener('click', async (e)=>{
  const tr = e.target.closest('tr'); if(!tr) return;
  const key = tr.dataset.key;
  if(e.target.classList.contains('btn-delete')){
    if(!confirm('¿Eliminar esta cuenta y su horario? Esto no se puede deshacer.')) return;
    try{
      const res = await fetch('/api/admin/users/'+encodeURIComponent(key), { method:'DELETE' });
      const b = await res.json();
      if(!res.ok) throw new Error(b.error||'Error');
      await loadUsers();
    }catch(err){ alert('No se pudo eliminar: '+err.message); }
  }
});

loadUsers().catch(e=>{
  document.getElementById('msg').hidden = true;
  document.getElementById('err').textContent = 'No se pudo cargar: ' + e.message;
});
</script>
</body>
</html>
